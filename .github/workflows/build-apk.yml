name: Gerar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Copiar o jogo e o motor 3D para o app
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          if curl -fsSL -o android/app/src/main/assets/three.min.js https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js; then
            sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#three.min.js#' android/app/src/main/assets/index.html
          fi
      - name: Compilar APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: rocket-car-game-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Rocket Car Game (APK mais recente)
          files: android/app/build/outputs/apk/debug/app-debug.apk
